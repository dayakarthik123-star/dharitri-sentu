services:
  dharitri-sentu:
    build: .
    image: dharitri-sentu:local
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      ENABLE_DEMO_ACCOUNTS: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - dharitri-sentu-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dharitri-sentu-data:
